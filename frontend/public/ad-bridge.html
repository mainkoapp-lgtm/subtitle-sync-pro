<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안전 이동 페이지 - Subtitle Sync Pro</title>
  <style>
    body { 
      background-color: #0f172a; 
      color: #f8fafc; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      margin: 0; 
      text-align: center; 
    }
    .spinner { 
      border: 4px solid rgba(255,255,255,0.1); 
      width: 40px; 
      height: 40px; 
      border-radius: 50%; 
      border-left-color: #6366f1; 
      animation: spin 1s linear infinite; 
      margin-bottom: 20px; 
    }
    @keyframes spin { 
      0% { transform: rotate(0deg); } 
      100% { transform: rotate(360deg); } 
    }
    .warning { 
      color: #fca5a5; 
      background: rgba(239, 68, 68, 0.1); 
      border: 1px solid rgba(239, 68, 68, 0.3); 
      padding: 15px; 
      border-radius: 8px; 
      margin-top: 25px; 
      display: none; 
      max-width: 450px; 
      font-size: 0.95rem; 
      line-height: 1.6; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div style="display: flex; flex-direction: column; align-items: center; padding: 20px;">
      <div class="spinner"></div>
      <h2>광고 확인을 위해 이동 중입니다...</h2>
      <p style="color: #94a3b8; font-size: 0.95rem;">잠시만 기다려주세요 (약 1.5초)</p>
      
      <div id="warning" class="warning">
        ❗ 만약 화면이 멈추거나 광고가 표시되지 않는다면, <br>
        <strong>현재 이 창에서도 광고 차단기(AdGuard 등)를 잠시 해제</strong>해 주셔야 정상적으로 작업(싱크/다운로드)이 시작됩니다.
      </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetUrl = urlParams.get('target');
    const type = urlParams.get('type');

    // [신규] 메인 창에 팝업이 성공적으로 열렸음을 보고
    if (window.opener) {
      window.opener.postMessage({ type: 'AD_BRIDGE_OPENED' }, window.location.origin);
    }

    async function validateAdAccess() {
      // [신규] 테스트 파라미터 확인 (?adblock_test=1: 강제 차단, ?adblock_test=0: 강제 허용)
      const testParam = urlParams.get('adblock_test');
      if (testParam === '1') {
        console.log("[AdPopup] Forced block by test parameter.");
        return false;
      }
      if (testParam === '0') {
        console.log("[AdPopup] Forced allow by test parameter.");
        return true;
      }

      // 1. 단순 스크립트 실행 확인 (이미 도달함)
      // 2. 외부 광고 도메인 접근성 테스트 (가장 확실한 방법)
      let networkOk = false;
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 1200);
        // 광고 도메인 중 하나인 omg10.com의 파비콘이나 무해한 리소스 페치 시도
        await fetch('https://omg10.com/favicon.ico', { mode: 'no-cors', signal: controller.signal });
        clearTimeout(timeoutId);
        networkOk = true;
      } catch (e) {
        console.warn("Ad domain access failed - likely blocked by AdGuard/uBlock");
        networkOk = false;
      }
      return networkOk;
    }

    setTimeout(async () => {
      const isAdAccessible = await validateAdAccess();
      
      if (!isAdAccessible) {
        document.getElementById('warning').style.display = 'block';
        document.getElementById('warning').innerHTML = `
          ❗ <strong>광고 차단기(AdGuard 등)가 작동 중입니다.</strong><br>
          현재 창에서도 광고 도메인 접근이 차단되어 작업을 계속할 수 없습니다.<br>
          차단기를 완전히 끄거나 이 도메인을 허용하신 후 다시 시도해 주세요.
        `;
        return; // ACTIVE 신호를 보내지 않음으로써 메인 창에서 중단하게 함
      }

      document.getElementById('warning').style.display = 'block';
      
      // [신규] 모든 검증 통과 후 리다이렉트 직전 보고
      if (window.opener) {
        window.opener.postMessage({ type: 'AD_BRIDGE_ACTIVE' }, window.location.origin);
      }
      
      if (type === 'clickmon') {
        const c = 'https://tab2.clickmon.co.kr/pop/wp_ad_pop_js.php?PopAd=CM_M_1003067%7C%5E%7CCM_A_1156063%7C%5E%7CAdver_M=2&mon_di=';
        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = c + '&mon_rf=' + encodeURIComponent(window.location.href) + '&mon_direct_url=' + encodeURIComponent('PASSBACK_INPUT');
        document.body.appendChild(script);
      } else if (targetUrl) {
        window.location.href = targetUrl;
      }
    }, 1500);
  </script>
</body>
</html>
